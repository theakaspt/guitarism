<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>기타 이론 — 새 주소로 이사했어요</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E1113" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="기타 이론" />
<link rel="apple-touch-icon" href="../public/icon-180.png" />
<style>
  html, body { margin: 0; padding: 0; background: #0E1113; }
  body {
    color: #F2EEE6;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    max-width: 420px; width: 100%; text-align: center;
    background: #171C1F; border-radius: 16px; padding: 32px 24px;
    box-sizing: border-box;
  }
  .label {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #6E7A80; margin-bottom: 12px;
  }
  h1 { font-size: 19px; margin: 0 0 16px; font-weight: 800; }
  p { font-size: 13px; line-height: 1.7; color: #9AA5AB; margin: 0 0 16px; }
  a.go {
    display: inline-block; margin-top: 8px;
    background: #E0A54B; color: #0E1113;
    text-decoration: none; font-size: 15px; font-weight: 800;
    padding: 12px 24px; border-radius: 999px;
  }
  .note {
    margin-top: 24px; padding-top: 16px; border-top: 1px solid #252C31;
    font-size: 11px; line-height: 1.7; color: #6E7A80;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="label">기타 이론 · Guitarism</div>
    <h1>새 주소로 이사했어요</h1>
    <p>
      이 주소는 더 이상 쓰지 않습니다.<br />
      아래 버튼을 눌러 새 주소로 이동해 주세요.
    </p>

    <!--
      ↓↓↓ 여기 두 곳의 주소를 Vercel 주소로 바꾸세요 (예: https://guitarism.vercel.app) ↓↓↓
      바꿀 곳은 아래 <a> 태그의 href 하나와, 그 안의 글자 하나입니다.
    -->
    <a class="go" href="https://guitarism.vercel.app">새 주소로 이동</a>

    <div class="note">
      <b style="color:#9AA5AB">아이폰 홈 화면에 아이콘을 두셨다면</b><br />
      예전 아이콘은 이 안내로 연결됩니다. 새 주소를 연 다음
      <b style="color:#9AA5AB">공유 → 홈 화면에 추가</b>로 다시 등록하고,
      예전 아이콘은 꾹 눌러 삭제해 주세요.
    </div>
  </div>
</body>
</html>
